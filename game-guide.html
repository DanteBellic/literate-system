name+'</h1><div class="intro">'+stories[name]+'</div><div class="section"><h2>📚 راهنمای این بازی</h2><p class="note">فعلاً این صفحه برای معرفی و داستان بازی آماده شده است. بخش مراحل، نکات و راهنماها بعداً به همین صفحه اضافه می‌شود.</p></div>'}else{app.innerHTML='<span class="kicker">GAME GUIDES</span><h1>بازی را انتخاب کن</h1><div class="intro">برای ورود به صفحه معرفی هر بازی، یکی از گزینه‌های زیر را انتخاب کن.</div><div class="section"><a class="game-option" href="game-guide.html?game=Minecraft">Minecraft</a><a class="game-option" href="game-guide.html?game=GTA">GTA</a><a class="game-option" href="game-guide.html?game=PUBG Mobile">PUBG Mobile</a><a class="game-option" href="game-guide.html?game=Free Fire">Free Fire</a><a class="game-option" href="game-guide.html?game=Fortnite">Fortnite</a><a class="game-option" href="game-guide.html?game=Call of Duty Mobile">Call of Duty Mobile</a><a class="game-option" href="game-guide.html?game=Clash of Clans">Clash of Clans</a><a class="game-option" href="game-guide.html?game=Clash Royale">Clash Royale</a><a class="game-option" href="game-guide.html?game=EA SPORTS FC">EA SPORTS FC</a></div>'}</script></body></html>
